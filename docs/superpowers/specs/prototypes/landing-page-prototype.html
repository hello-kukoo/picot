<!DOCTYPE html>
<!--
ABOUTME: Landing page visual prototype (static, prototype-only — not wired to the app).
ABOUTME: Open directly in a browser; theme/lang toggles are prototype chrome, not app features.
-->
<html lang="en" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Picot — Landing Page Prototype</title>
    <style>
      /* ── Real design tokens (style-theme.css: night + clean) ── */
      :root {
        --font-size-md: 14px;
        --font-size-lg: 16px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-6: 24px;
        --space-8: 32px;
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius: 16px;
        --ease: cubic-bezier(0.4, 0, 0.2, 1);
        --duration: 0.2s;
        --sidebar-width: 272px;
      }
      :root,
      :root[data-theme="night"] {
        color-scheme: dark;
        --bg-solid: #212121;
        --bg-glass: rgba(255, 255, 255, 0.04);
        --bg-glass-hover: rgba(255, 255, 255, 0.06);
        --bg-glass-active: rgba(255, 255, 255, 0.08);
        --text-primary: rgba(255, 255, 255, 0.88);
        --text-secondary: rgba(255, 255, 255, 0.5);
        --text-dim: rgba(255, 255, 255, 0.3);
        --border: rgba(255, 255, 255, 0.06);
        --border-hover: rgba(255, 255, 255, 0.1);
        --border-bright: rgba(255, 255, 255, 0.14);
      }
      :root[data-theme="clean"] {
        color-scheme: light;
        --bg-solid: #ffffff;
        --bg-glass: rgba(0, 0, 0, 0.03);
        --bg-glass-hover: rgba(0, 0, 0, 0.06);
        --bg-glass-active: rgba(0, 0, 0, 0.09);
        --text-primary: rgba(0, 0, 0, 0.88);
        --text-secondary: rgba(0, 0, 0, 0.55);
        --text-dim: rgba(0, 0, 0, 0.35);
        --border: rgba(0, 0, 0, 0.08);
        --border-hover: rgba(0, 0, 0, 0.14);
        --border-bright: rgba(0, 0, 0, 0.2);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
          "SF Pro Text", "Helvetica Neue", sans-serif;
        font-size: var(--font-size-md);
        background: var(--bg-solid);
        color: var(--text-primary);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        transition: background var(--duration) var(--ease);
      }
      .app-layout { display: flex; height: 100vh; }

      /* ── Sidebar replica (simplified, token-faithful) ── */
      .sidebar {
        width: var(--sidebar-width);
        flex-shrink: 0;
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: var(--space-3);
        gap: var(--space-3);
      }
      .sidebar-header { display: flex; align-items: center; gap: var(--space-2); }
      .mode-logo {
        width: 28px; height: 28px; border-radius: var(--radius-sm);
        display: flex; align-items: center; justify-content: center;
        background: var(--bg-glass); flex-shrink: 0;
      }
      .mode-logo img { width: 18px; height: 18px; }
      .search-pill {
        flex: 1; height: 28px; border-radius: var(--radius-sm);
        background: var(--bg-glass); border: 1px solid var(--border);
        display: flex; align-items: center; padding: 0 var(--space-2);
        color: var(--text-dim); font-size: 12px; gap: 6px;
      }
      .icon-btns { display: flex; gap: 4px; }
      .icon-btn {
        width: 28px; height: 28px; border-radius: var(--radius-sm);
        background: var(--bg-glass); border: 1px solid var(--border);
        display: flex; align-items: center; justify-content: center;
        color: var(--text-secondary); cursor: pointer;
      }
      .icon-btn:hover { background: var(--bg-glass-hover); color: var(--text-primary); }
      .session-list { flex: 1; overflow: hidden; }
      .list-label {
        font-size: 11px; letter-spacing: 0.08em; color: var(--text-dim);
        text-transform: uppercase; padding: var(--space-2) var(--space-1);
      }
      .ws-row {
        display: flex; align-items: center; gap: var(--space-2);
        padding: 6px var(--space-2); border-radius: var(--radius-sm);
        color: var(--text-secondary); margin-bottom: 2px;
      }
      .ws-row:hover { background: var(--bg-glass); color: var(--text-primary); }
      .ws-row .dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: var(--text-dim); flex-shrink: 0;
      }
      .ws-row .bar { height: 8px; border-radius: 4px; background: var(--bg-glass-hover); }
      .sidebar-footer { border-top: 1px solid var(--border); padding-top: var(--space-2); }
      .settings-row {
        display: flex; align-items: center; gap: var(--space-2);
        padding: 6px var(--space-2); border-radius: var(--radius-sm);
        color: var(--text-secondary); font-size: 13px;
      }
      .settings-row:hover { background: var(--bg-glass); }

      /* ── Landing main area ── */
      .landing {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* 垂直略偏上，对齐 ORCA 原型的 1/3 起始 */
        padding-bottom: 12vh;
      }
      .landing-logo {
        width: 112px; height: 112px;
        border-radius: 28px;
        background: var(--bg-glass);
        border: 1px solid var(--border);
        display: flex; align-items: center; justify-content: center;
      }
      .landing-logo img { width: 64px; height: 64px; }
      :root[data-theme="night"] .landing-logo img { content: url("../../../public/icons/logo.svg"); }
      :root[data-theme="clean"] .landing-logo img { content: url("../../../public/icons/logo-dark.svg"); }
      .landing-name {
        margin-top: var(--space-6);
        font-size: 56px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }
      .landing-hint {
        margin-top: var(--space-4);
        font-size: var(--font-size-lg);
        color: var(--text-secondary);
        text-align: center;
        max-width: 420px;
      }
      .landing-actions { margin-top: var(--space-8); display: flex; gap: var(--space-3); }
      .landing-btn {
        display: inline-flex; align-items: center; gap: var(--space-2);
        height: 40px; padding: 0 var(--space-6);
        border-radius: var(--radius-md);
        background: var(--bg-glass-hover);
        border: 1px solid var(--border-bright);
        color: var(--text-primary);
        font-size: var(--font-size-md);
        font-weight: 500;
        cursor: pointer;
        transition: background var(--duration) var(--ease),
          border-color var(--duration) var(--ease);
      }
      .landing-btn:hover { background: var(--bg-glass-active); border-color: var(--border-hover); }
      .landing-btn:active { transform: translateY(1px); }

      /* ── Prototype-only chrome (theme / lang toggles) ── */
      .proto-bar {
        position: fixed; right: 16px; bottom: 16px; z-index: 99;
        display: flex; gap: 8px;
        font-size: 12px; color: var(--text-dim);
      }
      .proto-bar button {
        height: 28px; padding: 0 12px; border-radius: var(--radius-sm);
        background: var(--bg-glass); border: 1px solid var(--border-bright);
        color: var(--text-secondary); cursor: pointer; font-size: 12px;
      }
      .proto-note {
        position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px;
        font-size: 11px; color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div class="app-layout">
      <!-- Left sidebar (replica; landing 态下唯一保留的区域) -->
      <div class="sidebar">
        <div class="sidebar-header">
          <span class="mode-logo" title="Chat"><img src="../../../public/icons/logo-dark.svg" alt="" /></span>
          <span class="search-pill">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <span data-proto="search">Search…</span>
          </span>
          <span class="icon-btns">
            <span class="icon-btn" title="Add project">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            </span>
            <span class="icon-btn" title="Refresh">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
            </span>
          </span>
        </div>
        <div class="session-list">
          <div class="list-label" data-proto="workspaces">Workspaces</div>
          <div class="ws-row"><span class="dot"></span><span class="bar" style="width: 120px"></span></div>
          <div class="ws-row"><span class="dot"></span><span class="bar" style="width: 90px"></span></div>
          <div class="ws-row"><span class="dot"></span><span class="bar" style="width: 140px"></span></div>
          <div class="ws-row"><span class="dot"></span><span class="bar" style="width: 76px"></span></div>
          <div class="ws-row"><span class="dot"></span><span class="bar" style="width: 108px"></span></div>
        </div>
        <div class="sidebar-footer">
          <div class="settings-row">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
            <span data-proto="settings">Settings</span>
          </div>
        </div>
      </div>

      <!-- Landing main area -->
      <div class="landing">
        <div class="landing-logo"><img src="../../../public/icons/logo.svg" alt="Picot logo" /></div>
        <div class="landing-name">Picot</div>
        <p class="landing-hint" data-proto="hint">
          Select a workspace from the sidebar to begin, or add a new project.
        </p>
        <div class="landing-actions">
          <button type="button" class="landing-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            <span data-proto="btn">Add a project</span>
          </button>
        </div>
      </div>
    </div>

    <div class="proto-bar">
      <button id="proto-theme">Theme: night</button>
      <button id="proto-lang">Lang: EN</button>
    </div>
    <div class="proto-note">Prototype only — toggles are not app features</div>

    <script>
      // Prototype-only switches: theme night↔clean, copy en↔zh.
      const COPY = {
        en: {
          hint: "Select a workspace from the sidebar to begin, or add a new project.",
          btn: "Add a project",
          search: "Search…",
          workspaces: "Workspaces",
          settings: "Settings",
        },
        zh: {
          hint: "从左侧栏选择一个工作区开始，或添加一个新项目。",
          btn: "添加项目",
          search: "搜索…",
          workspaces: "工作区",
          settings: "设置",
        },
      };
      let lang = "en";
      const applyLang = () => {
        for (const [key, value] of Object.entries(COPY[lang])) {
          const el = document.querySelector(`[data-proto="${key}"]`);
          if (el) el.textContent = value;
        }
      };
      document.getElementById("proto-theme").addEventListener("click", (e) => {
        const root = document.documentElement;
        const next = root.dataset.theme === "night" ? "clean" : "night";
        root.dataset.theme = next;
        e.target.textContent = `Theme: ${next}`;
      });
      document.getElementById("proto-lang").addEventListener("click", (e) => {
        lang = lang === "en" ? "zh" : "en";
        e.target.textContent = `Lang: ${lang.toUpperCase()}`;
        applyLang();
      });
    </script>
  </body>
</html>
